[package]
name = "mgdsc"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.11"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
