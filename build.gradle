plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.serbekun'
version = 'pre-alpha-2026-10-19'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

def generatedResourcesDir = layout.buildDirectory.dir('generated-resources')

tasks.register('generateVersionProperties') {
    def outputDir = generatedResourcesDir
    def projectVersion = project.version.toString()
    inputs.property('version', projectVersion)
    outputs.dir(outputDir)
    doLast {
        def file = outputDir.get().file('com/serbekun/mgdsw/version.properties').asFile
        file.parentFile.mkdirs()
        file.text = "version=${projectVersion}\n"
    }
}

sourceSets.main.output.dir(generatedResourcesDir, builtBy: 'generateVersionProperties')

dependencies {

    implementation("io.javalin:javalin:7.2.3")

    implementation("org.slf4j:slf4j-api:2.0.16")
    runtimeOnly("ch.qos.logback:logback-classic:1.5.18")

    implementation("com.fasterxml.jackson.core:jackson-databind:2.19.1")
    
    implementation("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.22.2")

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
}

application {
    mainClass = 'com.serbekun.mgdsw.Main'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']
}

tasks.shadowJar {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
